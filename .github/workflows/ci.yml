name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    name: Build From Source & Verify All 7 Stages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Rust ARM64 & Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(command -v sdkmanager || ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n 1)"
          PKGS=()
          [ -f "$SDK/platforms/android-34/android.jar" ] || PKGS+=("platforms;android-34")
          [ -f "$SDK/build-tools/34.0.0/aapt2" ] || PKGS+=("build-tools;34.0.0")
          if [ ! -d "$SDK/ndk" ] || [ -z "$(find "$SDK/ndk" -maxdepth 6 -name 'aarch64-linux-android29-clang++' 2>/dev/null | head -n 1)" ]; then
            PKGS+=("ndk;29.0.14206865")
          fi
          if [ ${#PKGS[@]} -gt 0 ]; then
            yes | "$SDKMGR" --licenses >/dev/null || true
            "$SDKMGR" "${PKGS[@]}"
          fi
          NDK_DIR="$(find "$SDK/ndk" -maxdepth 6 -name 'aarch64-linux-android29-clang++' 2>/dev/null | head -n 1 | sed 's|/toolchains/.*||')"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "Using SDK=$SDK NDK=$NDK_DIR"

      - name: Validate Metadata, Governance, SPDX & Secret Hygiene
        run: |
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          # 1. Validate module.prop
          props = {}
          for raw in Path("module/module.prop").read_text(encoding="utf-8").splitlines():
              if "=" in raw and not raw.lstrip().startswith("#"):
                  k, v = raw.split("=", 1)
                  props[k.strip()] = v.strip()
          for req in ("id", "name", "version", "versionCode", "author", "description", "updateJson"):
              assert props.get(req), f"Missing required module.prop key: {req}"
          assert props["version"].startswith("v"), f"Invalid version format: {props['version']}"

          # 2. Validate update.json
          upd = json.loads(Path("update.json").read_text(encoding="utf-8"))
          assert upd.get("version") == props["version"] and int(upd.get("versionCode", -1)) == int(props["versionCode"])
          assert upd.get("zipUrl", "").startswith("https://") and upd.get("changelog", "").startswith("https://")

          # 3. Validate governance files
          for doc in ("LICENSE", "NOTICE", "CODE_OF_CONDUCT.md", "SECURITY.md", "CONTRIBUTING.md", "CHANGELOG.md", "AI_CONTRIBUTIONS.md"):
              p = Path(doc)
              assert p.is_file() and p.stat().st_size > 0, f"Missing governance file: {doc}"

          # 4. Validate SPDX headers, zero committed ELF/DEX binaries, and zero secret leaks
          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          secret_patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |)PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"\bAIza[0-9A-Za-z_-]{35}\b"),
              re.compile(r"(ghp|gho|ghu|ghs|github_pat)_[A-Za-z0-9_]{10,}"),
          ]
          for rel in tracked:
              assert not rel.lower().endswith((".keystore", ".jks", ".pem", ".key", ".so", ".dex", ".apk", ".zip")), f"Forbidden key or prebuilt binary tracked in Git: {rel}"
              assert rel != "module/bin/kgx-core", f"Prebuilt ELF must not be tracked in Git: {rel}"
              p = Path(rel)
              if rel != "companion/zygisk-spoof/include/zygisk.hpp" and (
                  p.suffix.lower() in {".sh", ".py", ".rs", ".cpp", ".java"} or p.name in {"kgxctl", "update-binary"}
              ):
                  head = "\n".join(p.read_text(encoding="utf-8").splitlines()[:5])
                  assert "SPDX-License-Identifier: GPL-3.0-or-later" in head, f"Missing SPDX header in {rel}"
              if rel == "tests/verify_all.py":
                  continue
              raw = p.read_bytes()
              if b"\x00" in raw[:4096]:
                  continue
              txt = raw.decode("utf-8", errors="ignore")
              for rx in secret_patterns:
                  assert not rx.search(txt), f"Potential secret pattern matched in {rel}"

          print(f"Governance, SPDX, Zero-Prebuilt-Binary & Hygiene PASSED across {len(tracked)} tracked files.")
          PY

      - name: Compile Rust ARM64 & Zygisk Binaries from Source
        run: python3 -u scripts/build_rust.py

      - name: Build Display Helper DEX & Companion APK from Source
        run: python3 -u scripts/build_apk.py

      - name: Package KernelSU Module ZIP
        run: python3 -u scripts/build_zip.py

      - name: Run Full Verification Suite (All 7 Stages)
        run: python3 -u tests/verify_all.py

      - name: Print Build Checksums (SHA-256)
        run: |
          sha256sum dist/KSU-Ultimate-Gaming-X-*.zip dist/KSU-Ultimate-Gaming-X-*.apk
          cat dist/KSU-Ultimate-Gaming-X-*.sha256

      - name: Upload Build Artifacts (ZIP + APK)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ksu-ultimate-gaming-x-from-source-builds
          path: |
            dist/KSU-Ultimate-Gaming-X-*.zip
            dist/KSU-Ultimate-Gaming-X-*.zip.sha256
            dist/KSU-Ultimate-Gaming-X-*.apk
            dist/KSU-Ultimate-Gaming-X-*.apk.sha256
          if-no-files-found: error
